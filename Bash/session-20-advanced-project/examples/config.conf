# تنظیمات سیستم مدیریت لاگ

# مسیرهای لاگ
LOG_PATHS=(
    "/var/log/syslog"
    "/var/log/auth.log"
    "/var/log/apache2/access.log"
)

# تنظیمات دیتابیس
DB_PATH="/tmp/log_monitor.db"

# تنظیمات alerting
ALERT_EMAIL="admin@example.com"
ALERT_THRESHOLD_ERROR=10
ALERT_THRESHOLD_WARNING=20

# تنظیمات مانیتورینگ
MONITOR_INTERVAL=60
LOG_RETENTION_DAYS=30
