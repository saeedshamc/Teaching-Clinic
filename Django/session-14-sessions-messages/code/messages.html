<!-- messages.html — نمایش پیام‌ها (در base.html قرار دهید) -->
{% if messages %}
<div class="messages">
    {% for msg in messages %}
        <!-- msg.tags مقادیر success/error/info/warning/debug است -->
        <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
    {% endfor %}
</div>
{% endif %}

<!-- در ویوها: messages.success(request, "متن") و در قالب خودش نمایش داده می‌شود -->
