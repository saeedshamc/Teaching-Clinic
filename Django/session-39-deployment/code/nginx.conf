# nginx.conf — نمونه کانفیگ Nginx برای Django
# این فایل را در /etc/nginx/sites-available/example.com قرار دهید.

server {
    listen 80;
    server_name example.com www.example.com;

    # ریدایرکت به HTTPS (بعد از فعال‌سازی SSL)
    # return 301 https://$host$request_uri;

    # فایل‌های استاتیک — مستقیم از دیسک سرو می‌شوند (سریع)
    location /static/ {
        alias /var/www/example.com/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # فایل‌های media — آپلودهای کاربر
    location /media/ {
        alias /var/www/example.com/media/;
        expires 7d;
    }

    # بقیهٔ درخواست‌ها → Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
