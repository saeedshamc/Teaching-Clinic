<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جلسه 71: Modal، Toast، Tooltip و Popover</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page container py-4">
    <p class="text-secondary mb-1">CSS-UI · جلسه 71 · Bootstrap</p>
    <h1 class="mb-3">Modal، Toast، Tooltip و Popover</h1>
    <div class="alert alert-light border">
      توضیحات کامل:
      <a href="./session-71-bootstrap-overlays.md">session-71-bootstrap-overlays.md</a>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#demoModal">
        باز کردن Modal
      </button>
      <button type="button" class="btn btn-success" id="showToastBtn">نمایش Toast</button>
      <button type="button" class="btn btn-outline-dark" data-bs-toggle="tooltip" data-bs-placement="top" title="این یک راهنمای کوتاه است">
        Tooltip
      </button>
      <button
        type="button"
        class="btn btn-outline-secondary"
        data-bs-toggle="popover"
        data-bs-placement="bottom"
        data-bs-title="Popover"
        data-bs-content="محتوای بیشتر از Tooltip؛ با کلیک باز می‌شود."
      >
        Popover
      </button>
    </div>

    <div class="modal fade" id="demoModal" tabindex="-1" aria-labelledby="demoModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="demoModalLabel">تأیید عملیات</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="بستن"></button>
          </div>
          <div class="modal-body">
            آیا مطمئن هستید؟ این یک مودال نمونه برای تمرین دسترس‌پذیری و ساختار Bootstrap است.
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">تأیید</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 start-0 p-3">
      <div id="liveToast" class="toast text-bg-success" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">عملیات با موفقیت انجام شد.</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="بستن"></button>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between mt-5">
      <a href="../session-70/index.html">→ قبل</a>
      <a href="../session-72/index.html">بعد →</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
