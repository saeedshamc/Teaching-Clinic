<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جلسه 73: Carousel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page container py-4">
    <p class="text-secondary mb-1">CSS-UI · جلسه 73 · Bootstrap</p>
    <h1 class="mb-3">Carousel</h1>
    <div class="alert alert-light border">
      توضیحات کامل:
      <a href="./session-73-bootstrap-carousel.md">session-73-bootstrap-carousel.md</a>
    </div>

    <div id="heroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="اسلاید ۱"></button>
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" aria-label="اسلاید ۲"></button>
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" aria-label="اسلاید ۳"></button>
      </div>
      <div class="carousel-inner rounded overflow-hidden shadow-sm">
        <div class="carousel-item active" data-bs-interval="3500">
          <img src="https://placehold.co/960x320/7952b3/ffffff?text=Bootstrap+Carousel+1" class="d-block w-100" alt="اسلاید بنفش نمونه">
          <div class="carousel-caption d-none d-md-block">
            <h5>اسلاید اول</h5>
            <p>بنر معرفی محصول یا دوره</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="3500">
          <img src="https://placehold.co/960x320/0d6efd/ffffff?text=Bootstrap+Carousel+2" class="d-block w-100" alt="اسلاید آبی نمونه">
          <div class="carousel-caption d-none d-md-block">
            <h5>اسلاید دوم</h5>
            <p>ویژگی‌ها را کوتاه نشان دهید</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="3500">
          <img src="https://placehold.co/960x320/198754/ffffff?text=Bootstrap+Carousel+3" class="d-block w-100" alt="اسلاید سبز نمونه">
          <div class="carousel-caption d-none d-md-block">
            <h5>اسلاید سوم</h5>
            <p>دعوت به اقدام</p>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">قبلی</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">بعدی</span>
      </button>
    </div>

    <p class="text-muted mt-3 mb-0">این نمونه با <code>carousel-fade</code> و indicators ساخته شده است.</p>

    <div class="d-flex justify-content-between mt-5">
      <a href="../session-72/index.html">→ قبل</a>
      <a href="../session-74/index.html">بعد →</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
