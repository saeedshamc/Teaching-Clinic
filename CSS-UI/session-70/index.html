<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جلسه 70: Forms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page container py-4">
    <p class="text-secondary mb-1">CSS-UI · جلسه 70 · Bootstrap</p>
    <h1 class="mb-3">Forms</h1>
    <div class="alert alert-light border">توضیحات: <a href="./session-70-bootstrap-forms.md">session-70-bootstrap-forms.md</a></div>
    <form class="row g-3 needs-validation" novalidate id="bf">
      <div class="col-md-6">
        <label class="form-label" for="email">ایمیل</label>
        <input class="form-control" id="email" type="email" required>
        <div class="invalid-feedback">ایمیل معتبر وارد کنید.</div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="name">نام</label>
        <input class="form-control" id="name" type="text" required>
        <div class="invalid-feedback">نام لازم است.</div>
      </div>
      <div class="col-12">
        <button class="btn btn-success" type="submit">ارسال</button>
      </div>
    </form>
    <div class="d-flex justify-content-between mt-4">
      <a href="../session-69/index.html">→ قبل</a>
      <a href="../session-71/index.html">بعد →</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
