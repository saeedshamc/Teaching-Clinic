<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جلسه 90: Dark Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
    if (localStorage.getItem("tw-theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-900 transition-colors dark:bg-slate-950 dark:text-slate-100">
  <div class="mx-auto max-w-xl px-4 py-8">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-sm font-semibold text-sky-700 dark:text-sky-400">CSS-UI · جلسه 90 · Tailwind</p>
        <h1 class="mt-1 text-2xl font-bold">Dark Mode</h1>
      </div>
      <button type="button" id="themeBtn" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm dark:border-slate-600 dark:bg-slate-800">
        سوییچ تم
      </button>
    </div>
    <p class="mt-2 rounded-lg border border-slate-200 bg-white p-3 text-sm text-slate-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300">
      <a class="text-sky-700 underline dark:text-sky-400" href="./session-90-tailwind-dark.md">session-90-tailwind-dark.md</a>
    </p>

    <article class="mt-8 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
      <h2 class="text-lg font-bold">کارت دو حالته</h2>
      <p class="mt-2 text-slate-600 dark:text-slate-300">پس‌زمینه، متن و حاشیه با پیشوند <code class="text-sky-700 dark:text-sky-400">dark:</code> عوض می‌شوند.</p>
    </article>

    <div class="mt-12 flex justify-between text-sm font-semibold text-sky-700 dark:text-sky-400">
      <a href="../session-89/index.html">→ قبل</a>
      <a href="../session-91/index.html">بعد →</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
