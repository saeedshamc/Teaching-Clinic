<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جلسه 94: UI Kit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="mx-auto max-w-2xl px-4 py-8">
    <p class="text-sm font-semibold text-sky-700">CSS-UI · جلسه 94 · پروژه Tailwind</p>
    <h1 class="mt-1 text-2xl font-bold">UI Kit — پنل تنظیمات</h1>
    <p class="mt-2 rounded-lg border bg-white p-3 text-sm text-slate-600">
      <a class="text-sky-700 underline" href="./session-94-project-tailwind-uikit.md">session-94-project-tailwind-uikit.md</a>
    </p>

    <section class="mt-8 rounded-2xl border bg-white p-6 shadow-sm">
      <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">دکمه‌ها</h2>
      <div class="mt-3 flex flex-wrap gap-2">
        <button type="button" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700">Primary</button>
        <button type="button" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium hover:bg-slate-50">Secondary</button>
        <button type="button" class="rounded-lg bg-rose-600 px-4 py-2 text-sm font-medium text-white hover:bg-rose-700">Danger</button>
      </div>
    </section>

    <section class="mt-4 space-y-3">
      <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">تنظیمات ذخیره شد.</div>
      <div class="rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">اتصال به سرور برقرار نشد.</div>
    </section>

    <form class="mt-4 space-y-4 rounded-2xl border bg-white p-6 shadow-sm" id="kitForm">
      <h2 class="font-bold">تنظیمات حساب</h2>
      <div>
        <label class="block text-sm font-medium" for="displayName">نام نمایشی</label>
        <input id="displayName" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200" value="سارا">
      </div>
      <div>
        <label class="block text-sm font-medium" for="lang">زبان</label>
        <select id="lang" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200">
          <option>فارسی</option>
          <option>English</option>
        </select>
      </div>
      <label class="flex cursor-pointer items-center justify-between rounded-xl bg-slate-50 px-4 py-3">
        <span class="text-sm font-medium">اعلان ایمیل</span>
        <input type="checkbox" class="h-4 w-4 rounded border-slate-300 text-sky-600 focus:ring-sky-500" checked>
      </label>
      <button type="submit" class="w-full rounded-lg bg-slate-900 py-2.5 text-sm font-medium text-white hover:bg-slate-800">ذخیره</button>
    </form>

    <p class="mt-8 text-center text-sm text-slate-500">پایان بلوک Tailwind — بعد: Bulma</p>

    <div class="mt-6 flex justify-between text-sm font-semibold text-sky-700">
      <a href="../session-93/index.html">→ قبل</a>
      <a href="../session-95/index.html">شروع Bulma →</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
