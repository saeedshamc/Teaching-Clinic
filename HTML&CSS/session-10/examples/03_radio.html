<!DOCTYPE html>
<!-- جلسه 10 — مثال: 03_radio -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radio</title>
</head>
<body>
    <h1>radio — یک انتخاب از چند</h1>
    <form>
        <fieldset>
            <legend>سطح تجربه</legend>
            <label>
                <input type="radio" name="level" value="beginner" required> مبتدی
            </label>
            <label>
                <input type="radio" name="level" value="intermediate"> متوسط
            </label>
            <label>
                <input type="radio" name="level" value="advanced"> پیشرفته
            </label>
        </fieldset>
    </form>
</body>
</html>
