<!DOCTYPE html>
<!-- جلسه 10 — مثال: 02_checkbox -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkbox</title>
</head>
<body>
    <h1>checkbox — چند انتخاب</h1>
    <form>
        <fieldset>
            <legend>علاقه‌مندی‌ها</legend>
            <label>
                <input type="checkbox" name="interest" value="html"> HTML
            </label>
            <label>
                <input type="checkbox" name="interest" value="css"> CSS
            </label>
            <label>
                <input type="checkbox" name="interest" value="js"> JavaScript
            </label>
        </fieldset>
    </form>
</body>
</html>
