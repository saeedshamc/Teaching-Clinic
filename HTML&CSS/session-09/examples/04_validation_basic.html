<!DOCTYPE html>
<!-- جلسه 9 — مثال: 04_validation_basic -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>required و placeholder</title>
</head>
<body>
    <h1>اعتبارسنجی HTML5 پایه</h1>
    <form>
        <label for="fullname">نام کامل (الزامی):</label>
        <input type="text" id="fullname" name="fullname" required placeholder="مثلاً سعید احمدی">

        <label for="site">وب‌سایت:</label>
        <input type="url" id="site" name="site" placeholder="https://example.com">

        <label for="age2">سن (۱۸+):</label>
        <input type="number" id="age2" name="age2" min="18" max="120" required>

        <button type="submit">ثبت</button>
        <button type="reset">پاک کردن</button>
    </form>
</body>
</html>
