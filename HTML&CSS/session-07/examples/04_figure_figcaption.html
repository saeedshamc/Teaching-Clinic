<!DOCTYPE html>
<!-- جلسه 7 — مثال: 04_figure_figcaption -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>figure و figcaption</title>
</head>
<body>
    <h1>شکل با عنوان</h1>

    <figure>
        <img src="images/sample.svg" alt="نمودار ساختار HTML5" width="400" height="200">
        <figcaption>شکل ۱ — ساختار لایه‌ای HTML، CSS و JS</figcaption>
    </figure>

    <p>figure برای محتوای مستقل قابل ارجاع (تصویر، نمودار، کد).</p>
</body>
</html>
