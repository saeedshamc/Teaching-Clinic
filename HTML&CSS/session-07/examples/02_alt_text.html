<!DOCTYPE html>
<!-- جلسه 7 — مثال: 02_alt_text -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alt متن جایگزین</title>
</head>
<body>
    <h1>اهمیت alt</h1>

    <h2>تصویر معنادار</h2>
    <img src="images/sample.svg" alt="نمودار رشد بازدید سایت در شش ماه">

    <h2>تصویر تزئینی</h2>
    <img src="images/sample.svg" alt="">

    <p>
        alt خالی (<code>alt=""</code>) فقط برای تصاویر purely decorative —
        screen reader رد می‌شود.
    </p>
</body>
</html>
