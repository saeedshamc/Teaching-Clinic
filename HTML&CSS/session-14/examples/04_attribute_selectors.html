<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلسه ۱۴ — Attribute Selector</title>
    <link rel="stylesheet" href="04_attributes.css">
</head>
<body>
    <!-- جلسه ۱۴ — مثال ۰۴: سلکتور attribute -->

    <h1>سلکتور Attribute</h1>

    <form>
        <label>نام (الزامی):
            <input type="text" name="name" required placeholder="نام شما">
        </label>
        <label>ایمیل:
            <input type="email" name="email" placeholder="email@example.com">
        </label>
        <label>یادداشت (غیرفعال):
            <input type="text" disabled value="فقط خواندنی">
        </label>
    </form>

    <p>
        <a href="https://example.com" target="_blank">لینک خارجی</a> |
        <a href="mailto:info@example.com">ارسال ایمیل</a>
    </p>
</body>
</html>
