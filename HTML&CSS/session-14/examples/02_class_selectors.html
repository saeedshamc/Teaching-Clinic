<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلسه ۱۴ — Class Selector</title>
    <style>
        /* جلسه ۱۴ — مثال ۰۲: سلکتور class — .classname */

        body {
            font-family: Tahoma, sans-serif;
            padding: 24px;
            background: #ecf0f1;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card-title {
            color: #2c3e50;
            margin-top: 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        /* چند class روی یک عنصر: .btn.btn-large */
        .btn-large {
            padding: 14px 28px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="card-title">کارت اول</h2>
        <p>class قابل استفاده مجدد است — چند عنصر می‌توانند class یکسان داشته باشند.</p>
        <a href="#" class="btn btn-primary">دکمه اصلی</a>
        <a href="#" class="btn btn-danger btn-large">دکمه بزرگ</a>
    </div>

    <div class="card">
        <h2 class="card-title">کارت دوم</h2>
        <p>همان class <code>.card</code> روی div دیگر.</p>
    </div>
</body>
</html>
