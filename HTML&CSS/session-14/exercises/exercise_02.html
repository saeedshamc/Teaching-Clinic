<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمرین ۲ — Attribute Selector</title>
    <!-- TODO: فایل exercise_02.css بسازید:
         - input[type="text"] و input[type="number"]: border خاکستری
         - input[required]: border-right قرمز 3px
         - a[href^="https"]: رنگ آبی
         - button[type="submit"]: پس‌زمینه سبز، متن سفید
    -->
</head>
<body>
    <form>
        <input type="text" required placeholder="نام">
        <input type="number" placeholder="سن">
        <button type="submit">ارسال</button>
    </form>
    <p><a href="https://example.com">سایت نمونه</a></p>
</body>
</html>
