<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEM — Navbar</title>

</head>
<body>
  <style>
    .navbar{display:flex;justify-content:space-between;align-items:center;padding:1rem;background:#1e293b;color:#fff}
    .navbar__list{display:flex;gap:1rem;list-style:none;margin:0;padding:0}
    .navbar__link{color:#fff;text-decoration:none}
    .navbar__item--active .navbar__link{border-bottom:2px solid #38bdf8}
  </style>
  <nav class="navbar">
    <a class="navbar__brand" href="#">سایت</a>
    <ul class="navbar__list">
      <li class="navbar__item navbar__item--active"><a class="navbar__link" href="#">خانه</a></li>
      <li class="navbar__item"><a class="navbar__link" href="#">درباره</a></li>
    </ul>
  </nav>
</body>
</html>
