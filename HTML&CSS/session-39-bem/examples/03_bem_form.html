<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEM — Form</title>

</head>
<body>
  <style>
    .form{max-width:400px}.form__group{margin-bottom:1rem}
    .form__label{display:block;margin-bottom:.25rem}
    .form__input{width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px}
    .form__input--error{border-color:#dc2626}
    .form__button{padding:.5rem 1rem;background:#2563eb;color:#fff;border:none;border-radius:4px}
  </style>
  <form class="form">
    <div class="form__group"><label class="form__label" for="email">ایمیل</label>
    <input class="form__input form__input--error" id="email" type="email"></div>
    <button class="form__button" type="submit">ارسال</button>
  </form>
</body>
</html>
