<!DOCTYPE html>
<!-- جلسه 12 — مثال: 01_meta_tags -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="نمونه meta description برای SEO">
    <meta name="author" content="Teaching Clinic">
    <meta name="robots" content="index, follow">
    <title>Meta Tags</title>
</head>
<body>
    <h1>برچسب‌های meta</h1>
    <p>View Source — meta در head را ببینید.</p>
    <dl>
        <dt>description</dt>
        <dd>خلاصه برای نتایج جستجو</dd>
        <dt>robots</dt>
        <dd>index/noindex، follow/nofollow</dd>
        <dt>viewport</dt>
        <dd>نمایش موبایل</dd>
    </dl>
</body>
</html>
