<!DOCTYPE html>
<!-- جلسه 12 — مثال: 04_seo_basics -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="چک‌لیست SEO پایه HTML: title، headings، alt، semantic">
    <link rel="canonical" href="https://example.com/seo-checklist">
    <title>SEO پایه HTML — چک‌لیست</title>
</head>
<body>
    <main>
        <h1>چک‌لیست SEO پایه</h1>
        <ol>
            <li><strong>title</strong> یکتا و توصیفی (۵۰–۶۰ کاراکتر)</li>
            <li><strong>meta description</strong> جذاب (۱۵۰–۱۶۰ کاراکتر)</li>
            <li><strong>h1</strong> یکی — مطابق موضوع</li>
            <li><strong>alt</strong> روی همه img</li>
            <li><strong>semantic</strong> — header، main، article</li>
            <li><strong>lang</strong> روی html</li>
            <li><strong>لینک</strong> متن معنادار</li>
            <li><strong>canonical</strong> برای duplicate content</li>
        </ol>
    </main>
</body>
</html>
