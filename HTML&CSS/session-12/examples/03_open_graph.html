<!DOCTYPE html>
<!-- جلسه 12 — مثال: 03_open_graph -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Graph</title>
    <!-- Open Graph — اشتراک در شبکه‌های اجتماعی -->
    <meta property="og:title" content="دوره HTML — جلسه ۱۲">
    <meta property="og:description" content="metadata و SEO پایه">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://example.com/course/html">
    <meta property="og:locale" content="fa_IR">
</head>
<body>
    <h1>Open Graph</h1>
    <p>وقتی لینک share می‌شود، og:title و og:description نمایش داده می‌شود.</p>
</body>
</html>
