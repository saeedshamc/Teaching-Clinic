<!DOCTYPE html>
<!-- جلسه 4 — مثال: 01_strong_em -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>strong و em</title>
</head>
<body>
    <h1>تأکید معنایی</h1>

    <p><strong>توجه:</strong> پشتیبان‌گیری را قبل از حذف انجام دهید.</p>

    <p>من <em>حتماً</em> جلسه بعد را از دست نمی‌دهم.</p>

    <p>
        ترکیب: این جمله <strong>بسیار <em>مهم</em></strong> است —
        nesting درست رعایت شده.
    </p>
</body>
</html>
