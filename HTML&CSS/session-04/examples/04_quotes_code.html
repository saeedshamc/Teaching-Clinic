<!DOCTYPE html>
<!-- جلسه 4 — مثال: 04_quotes_code -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقل‌قول و کد</title>
</head>
<body>
    <h1>blockquote و code</h1>

    <blockquote cite="https://www.w3.org/">
        <p>وب برای همه طراحی شده — دسترس‌پذیر، بین‌المللی و قابل مشارکت.</p>
        <footer>— <cite>W3C Mission</cite></footer>
    </blockquote>

    <p>برای پاراگراف از <code>&lt;p&gt;</code> استفاده کنید.</p>

    <p>فرمول: E = mc<sup>2</sup> — آب: H<sub>2</sub>O</p>

    <pre><code>&lt;strong&gt;متن مهم&lt;/strong&gt;
&lt;em&gt;تأکید&lt;/em&gt;</code></pre>

    <p><abbr title="Cascading Style Sheets">CSS</abbr> در جلسه‌های بعد.</p>
</body>
</html>
