<!DOCTYPE html>
<!-- جلسه 4 — مثال: 03_mark_del_ins -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mark، del، ins</title>
</head>
<body>
    <h1>تغییر و هایلایت متن</h1>

    <p>نتیجه جستجو: یادگیری <mark>HTML</mark> برای وب.</p>

    <p>قیمت دوره:
        <del datetime="2026-08-01">۸۰۰٬۰۰۰</del>
        <ins datetime="2026-09-01">۶۵۰٬۰۰۰</ins>
        تومان
    </p>

    <p><small>تخفیف تا پایان شهریور — <del>کد OLD20</del> <ins>کد NEW30</ins></small></p>
</body>
</html>
