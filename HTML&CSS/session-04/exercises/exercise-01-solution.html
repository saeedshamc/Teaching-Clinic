    <title>Exercise 1: Format a Product Description</title>
</head>
<body>
    <h1>SuperWidget Pro</h1>
    
    <p><strong>Warning:</strong> Read instructions carefully before use.</p>
    
    <p>Features a powerful <abbr title="Central Processing Unit">CPU</abbr> for fast performance.</p>
    
    <p>Price: <del>$199.99</del> <ins>$149.99</ins></p>
    
    <p>To purchase, press <kbd>Enter</kbd>.</p>
