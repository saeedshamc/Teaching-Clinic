<body>
    <!-- 
        TASK: Fix the semantic formatting issues in this text
        
        Current issues:
        - Using b for warning (should be strong)
        - Using strong for emphasis (should be em)
        - Using quotes for book title (should be cite)
        - Not using abbr for CEO
        - Not using kbd for keyboard input
        
        Fix the formatting below
    -->
    <p><b>Warning:</b> Do not touch.</p>
    <p>I <strong>love</strong> pizza.</p>
    <p>The book "1984" is great.</p>
    <p>The CEO said yes.</p>
    <p>Press Ctrl + C to copy.</p>
</body>
