<!DOCTYPE html>
<!-- جلسه ۲ — metaهای مهم در head -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="نمونه meta description برای موتور جستجو">
    <meta name="author" content="دانشجوی دوره HTML">
    <meta name="keywords" content="HTML, آموزش, وب">
    <title>Head و Meta Tags</title>
</head>
<body>
    <h1>بخش head</h1>
    <p>View Page Source را بزنید — metaها را می‌بینید ولی در صفحه نیستند.</p>
    <p>فقط title در تب مرورگر نمایش داده می‌شود.</p>
</body>
</html>
