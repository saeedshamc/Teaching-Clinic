<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incorrect Nesting Example</title>
</head>
<body>
    <h1>Incorrect Nesting Demonstration</h1>
    
    <!-- INCORRECT: Tags are not properly nested -->
    <div>
        <p>This paragraph is inside a div, but...</p>
    </div>
    
    <!-- INCORRECT: Wrong order of closing tags -->
    <strong><em>This text has incorrect nesting</strong></em>
    
    <!-- CORRECT: Proper nesting -->
    <div>
        <p>This paragraph is correctly nested inside the div.</p>
    </div>
    
    <!-- CORRECT: Proper order of closing tags -->
    <strong><em>This text has correct nesting</em></strong>
    
    <p>Notice how the correct versions close tags in reverse order.</p>
</body>
</html>
