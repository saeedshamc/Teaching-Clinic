<!DOCTYPE html>
<!-- جلسه ۲ — nesting صحیح -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nesting صحیح</title>
</head>
<body>
    <h1>تو در تو بودن درست تگ‌ها</h1>

    <p>
        این پاراگراف شامل
        <strong>متن پررنگ</strong>
        و
        <em>متن تأکیدی</em>
        است.
    </p>

    <blockquote>
        <p>نقل‌قول داخل blockquote و پاراگراف جدا — nesting درست.</p>
    </blockquote>
</body>
</html>
