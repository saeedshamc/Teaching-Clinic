<!DOCTYPE html>
<!-- جلسه 11 — مثال: 01_semantic_layout -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چیدمان معنایی</title>
</head>
<body>
    <header>
        <h1>وبلاگ آموزشی</h1>
        <p>یادگیری HTML5 معنایی</p>
    </header>

    <nav>
        <ul>
            <li><a href="#">خانه</a></li>
            <li><a href="#">مقالات</a></li>
            <li><a href="#">درباره</a></li>
        </ul>
    </nav>

    <main>
        <article>
            <h2>اولین مقاله</h2>
            <p>محتوای اصلی مقاله در article قرار می‌گیرد.</p>
        </article>
    </main>

    <aside>
        <h2>پست‌های اخیر</h2>
        <ul>
            <li>HTML برای مبتدی</li>
            <li>لیست‌ها در HTML</li>
        </ul>
    </aside>

    <footer>
        <p>&copy; ۱۴۰۴ — دوره HTML</p>
    </footer>
</body>
</html>
