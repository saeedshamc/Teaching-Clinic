<!DOCTYPE html>
<!-- جلسه 11 — مثال: 02_header_nav_footer -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>header nav footer</title>
</head>
<body>
    <header>
        <img src="../session-07/examples/images/sample.svg" alt="لوگو" width="120" height="60">
        <h1>شرکت نمونه</h1>
    </header>

    <nav aria-label="منوی اصلی">
        <ul>
            <li><a href="#">خدمات</a></li>
            <li><a href="#">تماس</a></li>
        </ul>
    </nav>

    <main>
        <p>محتوای اصلی صفحه — فقط یک main در هر صفحه.</p>
    </main>

    <footer>
        <nav aria-label="لینک‌های پاورقی">
            <a href="#">حریم خصوصی</a>
            <a href="#">قوانین</a>
        </nav>
        <p>تماس: info@example.com</p>
    </footer>
</body>
</html>
