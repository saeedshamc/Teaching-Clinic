<!DOCTYPE html>
<!-- جلسه 8 — مثال: 03_colspan_rowspan -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colspan</title>
</head>
<body>
    <h1>ادغام ستون — colspan</h1>
    <table>
        <tr>
            <th colspan="2">اطلاعات شخصی</th>
            <th>تماس</th>
        </tr>
        <tr>
            <td>نام</td>
            <td>سعید</td>
            <td rowspan="2">info@example.com</td>
        </tr>
        <tr>
            <td>نام خانوادگی</td>
            <td>احمدی</td>
        </tr>
    </table>
    <p><code>colspan</code> چند ستون؛ <code>rowspan</code> چند سطر.</p>
</body>
</html>
