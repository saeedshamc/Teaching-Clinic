<!DOCTYPE html>
<!-- جلسه 8 — مثال: 04_accessible_table -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول دسترس‌پذیر</title>
</head>
<body>
    <h1>scope و caption</h1>
    <table>
        <caption>نتایج امتحان — ترم ۱</caption>
        <thead>
            <tr>
                <th scope="col">دانشجو</th>
                <th scope="col">HTML</th>
                <th scope="col">CSS</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">علی</th>
                <td>۱۸</td>
                <td>۱۶</td>
            </tr>
            <tr>
                <th scope="row">مریم</th>
                <td>۲۰</td>
                <td>۱۹</td>
            </tr>
        </tbody>
    </table>
    <p>از جدول فقط برای داده tabular استفاده کنید — نه layout.</p>
</body>
</html>
