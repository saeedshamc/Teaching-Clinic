<!DOCTYPE html>
<!-- جلسه 5 — مثال: 03_nested_lists -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست تو در تو</title>
</head>
<body>
    <h1>سرفصل دوره HTML</h1>
    <ul>
        <li>مبانی
            <ul>
                <li>ساختار سند</li>
                <li>عناصر متنی</li>
            </ul>
        </li>
        <li>محتوا
            <ul>
                <li>لیست‌ها</li>
                <li>لینک‌ها</li>
                <li>تصاویر</li>
            </ul>
        </li>
        <li>پیشرفته
            <ol>
                <li>فرم‌ها</li>
                <li>HTML5 معنایی</li>
            </ol>
        </li>
    </ul>
</body>
</html>
