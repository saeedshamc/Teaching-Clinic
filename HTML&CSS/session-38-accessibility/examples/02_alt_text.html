<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مثال ۲ — alt</title>

</head>
<body>
  <h1>متن جایگزین</h1>
  <!-- ❌ alt بی‌معنی -->
  <img src="https://via.placeholder.com/300x150" alt="تصویر" width="300">
  <!-- ✅ alt توصیفی -->
  <figure><img src="https://via.placeholder.com/300x150/6366f1/fff?text=Book"
    alt="جلد کتاب آبی روی میز" width="300"><figcaption>کتاب پرفروش</figcaption></figure>
  <!-- تزئینی -->
  <img src="https://via.placeholder.com/20" alt="" role="presentation">
</body>
</html>
