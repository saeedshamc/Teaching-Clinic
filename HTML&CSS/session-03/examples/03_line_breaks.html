<!DOCTYPE html>
<!-- جلسه ۳ — مثال: شکست خط با br -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شکست خط br</title>
</head>
<body>
    <h1>کاربرد br</h1>

    <h2>آدرس پستی</h2>
    <p>
        سعید احمدی<br>
        خیابان ولیعصر، پلاک ۱۲<br>
        تهران، ۱۴۱۵۹<br>
        ایران
    </p>

    <h2>شعر دو خطی</h2>
    <p>
        کد بنویس، وب بساز<br>
        HTML اولین قدم است
    </p>

    <p>برای فاصله بین <strong>بخش‌های</strong> مختلف از hr یا heading استفاده کنید، نه چند br.</p>
</body>
</html>
