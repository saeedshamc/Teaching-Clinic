    <h2>سطح ۲ — بخش اصلی</h2>
    <h3>سطح ۳ — زیربخش</h3>
    <h4>سطح ۴</h4>
    <h5>سطح ۵</h5>
    <h6>سطح ۶ — کوچک‌ترین</h6>
