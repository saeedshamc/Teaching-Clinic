<!DOCTYPE html>
<!-- جلسه 6 — مثال: 04_link_types -->
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انواع لینک</title>
</head>
<body>
    <h1>انواع href</h1>
    <ul>
        <li><a href="https://example.com">مطلق (absolute)</a></li>
        <li><a href="pages/about.html">نسبی (relative)</a></li>
        <li><a href="#footer">لنگر (#footer)</a></li>
        <li><a href="mailto:student@example.com">ایمیل</a></li>
        <li><a href="tel:+982112345678">تماس</a></li>
    </ul>

    <footer id="footer">
        <p>پاورقی — لنگر footer</p>
    </footer>
</body>
</html>
