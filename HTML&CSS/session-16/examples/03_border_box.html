<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلسه ۱۶ — Border</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 24px; display: flex; gap: 20px; flex-wrap: wrap; }

        .solid { border: 3px solid #3498db; padding: 16px; border-radius: 8px; }
        .dashed { border: 2px dashed #e74c3c; padding: 16px; }
        .dotted { border: 2px dotted #27ae60; padding: 16px; }
        .double { border: 4px double #8e44ad; padding: 16px; }
        .rounded { border: 2px solid #333; padding: 16px; border-radius: 50px; }
    </style>
</head>
<body>
    <div class="solid">solid</div>
    <div class="dashed">dashed</div>
    <div class="dotted">dotted</div>
    <div class="double">double</div>
    <div class="rounded">border-radius</div>
</body>
</html>
