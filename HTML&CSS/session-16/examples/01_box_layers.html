<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلسه ۱۶ — لایه‌های Box Model</title>
    <style>
        /* جلسه ۱۶ — مثال ۰۱: نمایش content, padding, border, margin */
        body { font-family: Tahoma, sans-serif; padding: 24px; background: #ecf0f1; }

        .box {
            width: 280px;
            background: #3498db;       /* content — آبی */
            color: white;
            padding: 24px;             /* padding — سبز در DevTools */
            border: 4px solid #2980b9;   /* border */
            margin: 32px;              /* margin — فاصله بیرون */
        }

        .label {
            font-size: 0.85em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>لایه‌های Box Model</h1>
    <div class="box">
        <strong>Content</strong>
        <p class="label">padding دور محتوا — margin بیرون border</p>
    </div>
    <p>F12 → Box Model diagram را ببینید.</p>
</body>
</html>
