<body>
    <h1>content-box vs border-box</h1>
    <p>هر دو width: 200px — padding و border اضافه می‌شود یا نه؟</p>

        <div class="box content-box"><h3>content-box</h3><p>عرض کل &gt; 200px</p></div>
        <div class="box border-box"><h3>border-box</h3><p>عرض کل = 200px</p></div>
    </div>
