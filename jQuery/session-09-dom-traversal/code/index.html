<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جلسه ۹ — پیمایش DOM پیشرفته</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Tahoma, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
    .box { border: 1px solid #ccc; padding: 12px; margin-bottom: 12px; border-radius: 8px; }
    .active { background: #fff4c2; }
    .highlight { background: #dff7e8; }
    button { margin: 4px; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; background: #2f6fed; color: white; }
    ul { padding-right: 20px; }
  
/* ===== chrome یکسان دوره jQuery ===== */
body { background:#f5f5f7; color:#1e293b; }
h1 { font-size:clamp(1.35rem, 1.05rem + 2vw, 1.85rem); color:#222; border-bottom:3px solid #4a56e2; padding-bottom:8px; margin-bottom:1.4rem; }
h2 { border-bottom:2px solid #4a56e2; padding-bottom:6px; color:#222; }
button { background:#4a56e2; color:#fff; border:none; padding:9px 16px; border-radius:8px; cursor:pointer; font-family:inherit; }
button:hover { background:#333cb5; }
input[type=text], input[type=email], input[type=password], input:not([type]), textarea, select {
  padding:9px 12px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit; background:#fff; color:#1e293b; box-sizing:border-box;
}
input:focus, textarea:focus, select:focus { border-color:#4a56e2; outline:none; box-shadow:0 0 0 3px rgba(74,86,226,.15); }
pre { background:#0f172a; color:#a7f3d0; padding:14px; border-radius:10px; overflow:auto; font-size:.9rem; }
a { color:#4a56e2; font-weight:600; }

/* ===== pager و بهبودهای دسترسی‌پذیری ===== */
.jq-pager { display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-top:2rem; padding-top:1rem; border-top:1px solid #e2e8f0; }
.jq-pager a { display:inline-block; padding:.5rem 1.1rem; border-radius:999px; background:#fff; border:1px solid #e2e8f0; color:#4a56e2; text-decoration:none; font-weight:700; box-shadow:0 4px 12px rgba(15,23,42,.06); }
.jq-pager a:hover { border-color:#4a56e2; }
:focus-visible { outline:3px solid rgba(74,86,226,.45); outline-offset:2px; }
::selection { background:#c7d2fe; }
</style>
</head>
<body>
  <h1>جلسه ۹: پیمایش DOM و ساخت/حذف المان‌ها</h1>

  <div class="box" id="parentBox">
    <strong>والد</strong>
    <ul id="itemList">
      <li class="item" id="item-1">آیتم ۱</li>
      <li class="item active" id="item-2">آیتم ۲</li>
      <li class="item" id="item-3">آیتم ۳</li>
    </ul>
  </div>

  <button id="btnParent">نمایش والد مستقیم</button>
  <button id="btnClosest">پیدا کردن نزدیک‌ترین .box</button>
  <button id="btnAppend">افزودن آیتم جدید</button>
  <button id="btnBefore">افزودن قبل از آیتم ۲</button>
  <button id="btnRemove">حذف آیتم ۲</button>
  <button id="btnDetach">detach کردن آیتم ۲</button>
  <p id="status">در این بخش، اعمال jQuery را ببینید.</p>

  <script>
  $(function () {
    // این بخش نشان می‌دهد که چگونه با پیمایش DOM به والد، برادر و نزدیک‌ترین عنصر دسترسی پیدا کنیم.
    // parent + closest
    $('#btnParent').on('click', function () {
      $('#item-2').parent().addClass('highlight');
      $('#status').text('والد مستقیم آیتم ۲ هایلایت شد.');
    });

    $('#btnClosest').on('click', function () {
      $('#item-2').closest('.box').addClass('highlight');
      $('#status').text('نزدیک‌ترین .box انتخاب شد.');
    });

    // ساخت و درج
    $('#btnAppend').on('click', function () {
      var $newItem = $('<li class="item"></li>').text('آیتم جدید');
      $('#itemList').append($newItem);
      $('#status').text('آیتم جدید اضافه شد.');
    });

    $('#btnBefore').on('click', function () {
      $('<li class="item">قبل از آیتم ۲</li>').insertBefore('#item-2');
      $('#status').text('یک آیتم قبل از آیتم ۲ اضافه شد.');
    });

    // حذف
    $('#btnRemove').on('click', function () {
      $('#item-2').remove();
      $('#status').text('آیتم ۲ حذف شد.');
    });

    $('#btnDetach').on('click', function () {
      var $detached = $('#item-3').detach();
      $('#itemList').append($detached);
      $('#status').text('آیتم ۳ detach شد و دوباره اضافه گردید.');
    });
  });
  </script>
  <nav class="jq-pager" aria-label="پیمایش جلسات">
    <a class="jq-prev" href="../../session-08-architecture-capstone/code/index.html">→ جلسه قبل</a>
    <a class="jq-next" href="../../session-10-animations/code/index.html">جلسه بعد ←</a>
  </nav>
</body>
</html>
