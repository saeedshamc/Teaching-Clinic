<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>جلسه ۱۵ — پلاگین‌نویسی</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Tahoma, sans-serif; max-width: 700px; margin: 40px auto; }
    .box { padding: 16px; border: 1px solid #ccc; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>جلسه ۱۵: ساخت پلاگین ساده</h1>
  <div class="box" id="box1">بک‌گراند زرد</div>
  <div class="box" id="box2">بک‌گراند آبی</div>

  <script>
  $.fn.highlight = function (color) {
    this.css('background-color', color);
    return this;
  };

  $(function () {
    $('#box1').highlight('yellow');
    $('#box2').highlight('#8ec5ff');
  });
  </script>
</body>
</html>
