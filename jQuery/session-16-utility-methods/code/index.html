<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>جلسه ۱۶ — متدهای کمکی</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Tahoma, sans-serif; max-width: 700px; margin: 40px auto; }
  </style>
</head>
<body>
  <h1>جلسه ۱۶: متدهای کمکی jQuery</h1>
  <button id="runBtn">اجرا</button>
  <pre id="output"></pre>

  <script>
  $(function () {
    $('#runBtn').on('click', function () {
      var nums = [1, 2, 3, 4];
      var doubled = $.map(nums, function (value) {
        return value * 2;
      });
      $('#output').text(JSON.stringify(doubled, null, 2));
    });
  });
  </script>
</body>
</html>
