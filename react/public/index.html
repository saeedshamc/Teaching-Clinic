<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <!-- 
      meta tag برای responsive بودن در موبایل
      viewport: تنظیمات نمایش در دستگاه‌های مختلف
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="آموزش صفحه ورود با React" />
    <title>آموزش صفحه ورود - React</title>
  </head>
  <body>
    <!-- 
      المان root: اینجا React برنامه را رندر می‌کند
      در فایل index.js با getElementById('root') به این المان دسترسی پیدا می‌کنیم
    -->
    <noscript>برای اجرای این برنامه باید JavaScript را فعال کنید.</noscript>
    <div id="root"></div>
  </body>
</html>
