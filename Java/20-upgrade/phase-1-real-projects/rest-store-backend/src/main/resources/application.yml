# application.yml — تنظیمات پروژهٔ فروشگاه
server:
  port: 8080

spring:
  application:
    name: store-backend
  datasource:
    url: jdbc:h2:mem:store;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: "change-me-in-production-32-chars-minimum!!"
    expiration-ms: 86400000   # 24h
