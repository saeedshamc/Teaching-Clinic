<!DOCTYPE html>
<!-- user-form.html — Thymeleaf template -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 400px; }
        input { width: 100%; padding: 8px; margin: 5px 0; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1 th:text="${user.id == 0 ? 'Add' : 'Edit'} + ' User'">User Form</h1>
    <form th:action="@{/users}" method="post" th:object="${user}">
        <input type="hidden" th:field="*{id}">
        <label>Name:</label>
        <input type="text" th:field="*{name}" required><br>
        <label>Email:</label>
        <input type="email" th:field="*{email}" required><br>
        <label>Age:</label>
        <input type="number" th:field="*{age}" required><br>
        <button type="submit">Save</button>
        <a th:href="@{/users}">Cancel</a>
    </form>
</body>
</html>
