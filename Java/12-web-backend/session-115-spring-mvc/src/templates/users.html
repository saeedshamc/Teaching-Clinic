<!DOCTYPE html>
<!-- users.html — Thymeleaf template -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users - Spring MVC</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #4CAF50; color: white; }
        tr:nth-child(even) { background: #f2f2f2; }
        .btn { background: #2196F3; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>User Management</h1>
    <a th:href="@{/users/new}" class="btn">Add User</a>

    <table th:if="${not #lists.isEmpty(users)}">
        <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Age</th><th>Actions</th>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.name}">Name</td>
            <td th:text="${user.email}">Email</td>
            <td th:text="${user.age}">25</td>
            <td>
                <a th:href="@{/users/{id}(id=${user.id})}">Edit</a> |
                <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post" style="display:inline">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>

    <p th:if="${#lists.isEmpty(users)}">No users found.</p>
</body>
</html>
