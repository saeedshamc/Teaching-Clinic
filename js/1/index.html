<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاسبه فاکتوریل</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 { color: #667eea; margin-bottom: 15px; font-size: 2em; }
        p { color: #666; line-height: 1.8; }
        .hint { margin-top: 20px; font-size: .95em; color: #764ba2; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>محاسبه فاکتوریل</h1>
        <p>این یک تمرین جداگانه است؛ عدد را در پنجرهٔ prompt وارد کنید و نتیجه را در کنسول مرورگر (F12) ببینید.</p>
        <p class="hint">برای باز کردن کنسول: F12 ← تب Console</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
