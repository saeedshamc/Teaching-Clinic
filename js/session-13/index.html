<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلسه 13: مدیریت خطا</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>جلسه 13: مدیریت خطا</h1>

        <section class="section">
            <h2>1. try / catch</h2>
            <div class="example">
                <button onclick="showTryCatch()">JSON خراب</button>
                <div id="try-output" class="output"></div>
            </div>
        </section>

        <section class="section">
            <h2>2. throw</h2>
            <div class="example">
                <button onclick="showThrow()">تقسیم بر صفر</button>
                <div id="throw-output" class="output"></div>
            </div>
        </section>

        <section class="section">
            <h2>3. الگوی نتیجه</h2>
            <div class="example">
                <input id="age-input" placeholder="سن را بنویسید" value="abc">
                <button onclick="showResultPattern()">بررسی سن</button>
                <div id="result-output" class="output"></div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
