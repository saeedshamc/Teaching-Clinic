<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلسه 9: رشته‌ها و Unicode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>جلسه 9: رشته‌ها و Unicode</h1>

        <div class="info">
            <strong>📌 راهنما:</strong> روی دکمه‌ها کلیک کنید تا خروجی در جعبهٔ تیره نمایش داده شود. جزئیات کامل در فایل markdown همین پوشه است.
        </div>

        <section class="section">
            <h2>1. متدهای رشته</h2>
            <div class="example">
                <button onclick="showStringMethods()">نمایش متدها</button>
                <div id="methods-output" class="output"></div>
            </div>
        </section>

        <section class="section">
            <h2>2. جستجو و جایگزینی</h2>
            <div class="example">
                <button onclick="showSearchReplace()">جستجو و replace</button>
                <div id="search-output" class="output"></div>
            </div>
        </section>

        <section class="section">
            <h2>3. Template Literal عملی</h2>
            <div class="example">
                <button onclick="showTemplates()">نمایش قالب‌ها</button>
                <div id="template-output" class="output"></div>
            </div>
        </section>

        <section class="section">
            <h2>4. Unicode پایه</h2>
            <div class="example">
                <button onclick="showUnicode()">نمایش Unicode</button>
                <div id="unicode-output" class="output"></div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
